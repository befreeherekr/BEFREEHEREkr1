<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Be Free Here</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
    }
    svg {
      max-width: 90vw;
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" width="600" height="220">
    <defs>
      <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%"   stop-color="#1a2744" stop-opacity="0"/>
        <stop offset="30%"  stop-color="#1a2744" stop-opacity="1"/>
        <stop offset="70%"  stop-color="#1a2744" stop-opacity="1"/>
        <stop offset="100%" stop-color="#1a2744" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <rect width="600" height="220" fill="#ffffff"/>

    <!-- Top decorative line -->
    <line x1="160" y1="62" x2="440" y2="62" stroke="url(#lineGrad)" stroke-width="0.8"/>

    <!-- Main logotype -->
    <text
      x="300"
      y="118"
      font-family="'Cormorant Garamond', 'Didot', 'Bodoni MT', 'Times New Roman', serif"
      font-size="52"
      font-weight="300"
      fill="#1a2744"
      text-anchor="middle"
      letter-spacing="14"
    >Be Free Here</text>

    <!-- Bottom decorative line -->
    <line x1="160" y1="134" x2="440" y2="134" stroke="url(#lineGrad)" stroke-width="0.8"/>

    <!-- Tagline -->
    <text
      x="300"
      y="162"
      font-family="'Noto Serif KR', 'Malgun Gothic', 'Apple SD Gothic Neo', serif"
      font-size="12"
      font-weight="400"
      fill="#1a2744"
      text-anchor="middle"
      letter-spacing="5"
      opacity="0.72"
    >행복한 장례의 시작 · 비프리히어</text>
  </svg>
</body>
</html>
